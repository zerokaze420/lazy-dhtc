name: Build

on:
  push:
    branches: [ "master" ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: npm run build:css

      - name: Build Linux
        if: runner.os == 'Linux'
        run: go build -v -o dhtc-linux cmd/dhtc/main.go

      - name: Build static Worker binaries
        if: runner.os == 'Linux'
        run: |
          GOARCH=amd64 ./scripts/build-worker.sh dist/dhtc-worker-linux-amd64
          GOARCH=arm64 ./scripts/build-worker.sh dist/dhtc-worker-linux-arm64
          file dist/dhtc-worker-linux-*

      - name: Build macOS
        if: runner.os == 'macOS'
        run: go build -v -o dhtc-macos cmd/dhtc/main.go

      - name: Build Windows
        if: runner.os == 'Windows'
        run: go build -v -o dhtc-windows.exe cmd/dhtc/main.go
