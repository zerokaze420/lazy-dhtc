application:
  subdomain: dhtc
  routes:
    - /=http://server.cloud.lazycat.app.dhtc.lzcapp:4200/

services:
  server:
    image: embed:app
    network_mode: host
    binds:
      - /lzcapp/var/dhtcdb:/lzcapp/var/dhtcdb
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:4200/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
